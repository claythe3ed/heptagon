name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v

  wheel-smoke-test:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify schema ships inside the wheel
        run: |
          python - <<'PYEOF'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              print("ERROR: no wheel in dist/")
              sys.exit(1)
          whl = wheels[0]
          print(f"Checking {whl}")
          names = zipfile.ZipFile(whl).namelist()
          required = [
              "heptagon/schemas/__init__.py",
              "heptagon/schemas/cirp.schema.json",
          ]
          for path in required:
              if path not in names:
                  print(f"MISSING from wheel: {path}")
                  sys.exit(1)
              print(f"OK: {path}")
          PYEOF

      - name: Install wheel into a fresh venv
        run: |
          python -m venv /tmp/fresh-venv
          /tmp/fresh-venv/bin/pip install --upgrade pip
          /tmp/fresh-venv/bin/pip install dist/*.whl

      - name: CLI smoke tests from fresh install
        run: |
          set -x
          /tmp/fresh-venv/bin/heptagon --version
          /tmp/fresh-venv/bin/heptagon declare examples/cirp-reference.yaml
          /tmp/fresh-venv/bin/heptagon simulate ransomware \
              --plan examples/cirp-reference.yaml --rounds 10
          # verify exits 1 when no evidence is logged — that is correct
          /tmp/fresh-venv/bin/heptagon verify examples/cirp-reference.yaml \
              && echo "UNEXPECTED: verify returned 0" && exit 1 \
              || echo "OK: verify returned non-zero (expected)"
