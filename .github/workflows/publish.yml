name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/heptagon7/
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify schema ships in wheel
        run: |
          python - <<'PYEOF'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              print("ERROR: no wheel in dist/")
              sys.exit(1)
          whl = wheels[0]
          print(f"Checking {whl}")
          names = zipfile.ZipFile(whl).namelist()
          required = [
              "heptagon/schemas/__init__.py",
              "heptagon/schemas/cirp.schema.json",
          ]
          for path in required:
              if path not in names:
                  print(f"MISSING from wheel: {path}")
                  sys.exit(1)
              print(f"OK: {path}")
          PYEOF

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
