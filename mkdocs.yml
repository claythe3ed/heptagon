site_name: Heptagon
site_description: Seven coordinates. Every incident. Verified.
site_url: https://claythe3ed.github.io/heptagon/
site_author: Muhammad Ali
repo_url: https://github.com/claythe3ed/heptagon
repo_name: claythe3ed/heptagon
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/luna.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: numpy
            show_root_heading: true
            show_category_heading: true

nav:
  - Home: index.md
  - Getting Started:
      - Install: getting-started/install.md
      - Quick Start: getting-started/quick-start.md
  - Concepts:
      - Philosophy: philosophy.md
      - Architecture: architecture.md
      - Threat Model: threat-model.md
  - CLI Reference: cli.md
  - API Reference: api.md
  - Showcase: showcase.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/claythe3ed/heptagon
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/heptagon7/
