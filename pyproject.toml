[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heptagon7"
version = "1.1.0"
description = "Seven coordinates. Every incident. Verified."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Muhammad Ali" },
]
dependencies = [
    "numpy>=2.0",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[project.scripts]
heptagon = "heptagon.cli.main:main"

[project.urls]
Homepage = "https://github.com/claythe3ed/heptagon"
Repository = "https://github.com/claythe3ed/heptagon"

[tool.setuptools.packages.find]
include = ["heptagon*"]

[tool.setuptools.package-data]
"heptagon.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
